# AWS App Runner — source-based deployment config (no Docker needed).
# App Runner reads this from the repo root when you create a service from source.
# Secrets (the source URLs with your FIRMS key) are NOT put here — set them as
# environment variables in the App Runner console/CLI, or via AWS Secrets Manager.
version: 1.0
runtime: python3
build:
  commands:
    build:
      - echo "No build step — this app uses only the Python standard library."
run:
  runtime-version: 3.11
  command: python apps/api/main.py
  network:
    port: 8025
  env:
    - name: PORT
      value: "8025"
    - name: DATA_MODE
      value: "live"
